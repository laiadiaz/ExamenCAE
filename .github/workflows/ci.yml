name: CI/CD SpringUMA

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: self-hosted

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Build project
      run: ./mvnw clean package

    - name: Run tests
      run: ./mvnw verify

    - name: Docker login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t laiadiaz/springuma:latest .

    - name: Push Docker image
      run: docker push laiadiaz/springuma:latest

    - name: Deploy Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl rollout restart deployment springuma-deployment